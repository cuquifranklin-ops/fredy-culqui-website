<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador - Fredy Culqui</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            background: radial-gradient(circle at top, #18060a 0%, #050505 100%);
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 2.5rem 2rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header .badge {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        .login-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.35rem;
        }

        .login-header p {
            color: var(--secondary);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.45rem;
            font-size: 0.9rem;
            color: var(--secondary);
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #0a0a0a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .error-msg {
            color: var(--accent);
            font-size: 0.88rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }

        .btn-full {
            width: 100%;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--secondary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-header">
            <span class="badge">Estudio Privado</span>
            <h1>Fredy Culqui</h1>
            <p>Inicia sesión para gestionar tu portafolio en GitHub</p>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required placeholder="Ingresa tu usuario">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <p class="error-msg" id="loginError">Usuario o contraseña incorrectos.</p>
            <button type="submit" class="btn btn-primary btn-full">
                <i class="fas fa-lock-open"></i> Entrar al Panel
            </button>
        </form>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver al sitio público</a>
    </div>

    <script>
        // Si ya hay sesión activa, ir directo al panel
        if (sessionStorage.getItem('fc_admin_auth') === 'true') {
            window.location.href = 'admin.html';
        }

        // Cambia aquí tu usuario y contraseña si lo deseas:
        const ADMIN_USER = 'fredy';
        const ADMIN_PASS = 'culqui2026';

        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;

            if (u === ADMIN_USER && p === ADMIN_PASS) {
                sessionStorage.setItem('fc_admin_auth', 'true');
                window.location.href = 'admin.html';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });
    </script>
</body>
</html>
